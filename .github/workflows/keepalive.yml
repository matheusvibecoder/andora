name: keep-alive
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render (mantem o servidor acordado)
        run: curl -s -o /dev/null -w "http:%{http_code}\n" --max-time 30 https://andora-75sw.onrender.com/ || true
