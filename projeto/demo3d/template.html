<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Andora</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#0b0e14;font-family:'Segoe UI',system-ui,Roboto,sans-serif;color:#e8e2d4;touch-action:none;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;z-index:0}
#c canvas{display:block;width:100%;height:100%}

/* ---------- menu principal ---------- */
#menu{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(180deg,rgba(8,10,18,.25) 0%,rgba(8,10,18,.55) 45%,rgba(8,10,18,.92) 100%)}
#menu.hidden{display:none}
.title-wrap{text-align:center;margin-bottom:26px;animation:fadeDown 1s ease}
.title{font-size:clamp(52px,11vw,110px);font-weight:200;letter-spacing:.32em;text-indent:.32em;
  background:linear-gradient(180deg,#f5e9cf 20%,#c9a45c 55%,#7a5a2c 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 30px rgba(201,164,92,.35))}
.subtitle{margin-top:6px;font-size:clamp(11px,2.6vw,15px);letter-spacing:.55em;text-indent:.55em;color:#c9a45caa;text-transform:uppercase}
.menu-card{width:min(340px,84vw);display:flex;flex-direction:column;gap:11px;animation:fadeUp 1s .2s ease both}
.btn{position:relative;overflow:hidden;padding:15px 22px;border:1px solid #c9a45c44;border-radius:12px;background:linear-gradient(120deg,#1a2030dd,#242c40dd);
  color:#f0e8d6;font-size:15.5px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:all .22s ease;backdrop-filter:blur(6px)}
.btn:hover{border-color:#c9a45c;background:linear-gradient(120deg,#2a3248ee,#33405cee);transform:translateY(-2px);box-shadow:0 10px 28px rgba(201,164,92,.18)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.primary{background:linear-gradient(120deg,#c9a45c,#a17c3c);color:#1c1408;border-color:#e6c98a;font-weight:600}
.btn.primary:hover{background:linear-gradient(120deg,#dcc084,#b8904c)}
.menu-foot{margin-top:22px;font-size:10.5px;letter-spacing:.18em;color:#9b8d6e88;text-align:center;line-height:2;text-transform:uppercase}
.save-list{width:min(340px,84vw);max-height:130px;overflow:auto;display:flex;flex-direction:column;gap:8px;margin-bottom:4px}
.save-item{padding:10px 14px;border:1px solid #c9a45c22;border-radius:10px;background:#141a2888;font-size:12.5px;cursor:pointer;letter-spacing:.06em}
.save-item:hover{border-color:#c9a45c66}

/* ---------- HUD ---------- */
#hud{position:fixed;top:calc(10px + env(safe-area-inset-top));left:14px;z-index:20;display:flex;gap:8px;align-items:center;pointer-events:none;opacity:.92}
.hud-pill{background:#0d1220cc;border:1px solid #c9a45c33;border-radius:20px;padding:7px 14px;font-size:13px;letter-spacing:.12em;backdrop-filter:blur(6px)}
#hud-quest{position:fixed;top:calc(52px + env(safe-area-inset-top));left:14px;z-index:20;background:#0d1220bb;border-left:2px solid #c9a45c;padding:8px 14px;border-radius:0 10px 10px 0;font-size:12px;letter-spacing:.1em;color:#e8d9b0;pointer-events:none;max-width:46vw}
#hud-horse{position:fixed;top:calc(52px + env(safe-area-inset-top));right:14px;z-index:20;background:#0d1220bb;border-right:2px solid #c9a45c;padding:8px 14px;border-radius:10px 0 0 10px;font-size:12px;letter-spacing:.08em;pointer-events:none;display:none}

/* ---------- toasts ---------- */
#toasts{position:fixed;top:calc(92px + env(safe-area-inset-top));right:14px;z-index:30;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{background:#131a2cee;border:1px solid #c9a45c44;color:#f0e8d6;padding:10px 16px;border-radius:10px;font-size:13px;letter-spacing:.06em;
  opacity:0;transform:translateX(24px);transition:all .35s ease;max-width:70vw}
.toast.on{opacity:1;transform:translateX(0)}

/* ---------- diálogo ---------- */
#dlg{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:25;width:min(660px,92vw);
  background:linear-gradient(160deg,#101624f2,#1a2234f2);border:1px solid #c9a45c55;border-radius:16px;padding:20px 22px;display:none;
  flex-direction:column;gap:13px;box-shadow:0 18px 50px rgba(0,0,0,.5);backdrop-filter:blur(10px)}
#dlg-name{font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:#c9a45c}
#dlg-text{font-size:15.5px;line-height:1.65;color:#eee6d4}
#dlg-choices{display:flex;flex-direction:column;gap:8px}
.dlg-btn{text-align:left;padding:11px 16px;border:1px solid #c9a45c33;border-radius:10px;background:#222c4288;color:#e8e2d4;font-size:13.5px;
  letter-spacing:.05em;cursor:pointer;transition:all .18s}
.dlg-btn:hover{background:#2e3a56;border-color:#c9a45c88;transform:translateX(4px)}

/* ---------- final / pause ---------- */
#ending,#pause{position:fixed;inset:0;z-index:50;background:rgba(6,8,14,.88);display:none;align-items:center;justify-content:center;flex-direction:column;gap:20px;backdrop-filter:blur(8px)}
#ending-text{width:min(560px,88vw);font-size:19px;line-height:1.8;text-align:center;color:#f0e8d6;letter-spacing:.04em}
#pause .btn{width:min(300px,80vw)}

/* ---------- controles touch ---------- */
#touch-ui{position:fixed;inset:0;z-index:15;pointer-events:none;display:none}
body.touch #touch-ui{display:block}
#joy{position:absolute;left:22px;bottom:calc(28px + env(safe-area-inset-bottom));width:120px;height:120px;border-radius:50%;
  background:radial-gradient(circle,#c9a45c22 0%,#c9a45c0a 70%);border:1.5px solid #c9a45c44;pointer-events:auto}
#joy::after{content:'';position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:#c9a45c55}
#look{position:absolute;right:0;top:0;width:55%;height:100%;pointer-events:auto}
.tbtn{position:absolute;width:62px;height:62px;border-radius:50%;border:1.5px solid #c9a45c55;background:#131a2ccc;color:#f0e8d6;
  font-size:12px;letter-spacing:.08em;pointer-events:auto;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.tbtn:active{background:#c9a45c44;transform:scale(.93)}
#b-interact{right:26px;bottom:calc(38px + env(safe-area-inset-bottom))}
#b-jump{right:100px;bottom:calc(78px + env(safe-area-inset-bottom))}
#b-mount{right:26px;bottom:calc(118px + env(safe-area-inset-bottom))}
#b-run{right:104px;bottom:calc(18px + env(safe-area-inset-bottom));width:52px;height:52px;font-size:11px}

/* ---------- cutscene ---------- */
#cutscene{position:fixed;inset:0;z-index:60;background:#000;display:none;align-items:center;justify-content:center}
#cutscene video{width:100%;height:100%;object-fit:contain;background:#000}
#cut-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
#cut-skip{position:absolute;right:22px;top:calc(22px + env(safe-area-inset-top));padding:11px 22px;border:1px solid #ffffff55;border-radius:22px;
  background:#000a;color:#fff;font-size:12px;letter-spacing:.28em;text-transform:uppercase;cursor:pointer;z-index:2}
#loading{position:fixed;inset:0;z-index:70;background:#0b0e14;display:none;align-items:center;justify-content:center;flex-direction:column;gap:18px}
.spin{width:44px;height:44px;border:2px solid #c9a45c33;border-top-color:#c9a45c;border-radius:50%;animation:sp 1s linear infinite}
#loading p{letter-spacing:.32em;font-size:11px;color:#c9a45c;text-transform:uppercase}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes fadeDown{from{opacity:0;transform:translateY(-22px)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="c"></div>

<div id="hud">
  <div class="hud-pill" id="hud-time">09:00</div>
  <div class="hud-pill" id="hud-weather">☀</div>
</div>
<div id="hud-quest">Explore Andora</div>
<div id="hud-horse"></div>
<div id="toasts"></div>

<div id="dlg">
  <div id="dlg-name"></div>
  <div id="dlg-text"></div>
  <div id="dlg-choices"></div>
</div>

<div id="ending">
  <div id="ending-text"></div>
  <button class="btn primary" id="ending-ok">CONTINUAR</button>
</div>

<div id="pause">
  <div class="title" style="font-size:34px">PAUSADO</div>
  <button class="btn primary" onclick="document.getElementById('pause').style.display='none'">VOLTAR</button>
  <button class="btn" id="btn-save">SALVAR MUNDO</button>
  <button class="btn" id="btn-sound">SOM: LIGADO</button>
  <button class="btn" onclick="location.reload()">MENU PRINCIPAL</button>
</div>

<div id="touch-ui">
  <div id="joy"></div>
  <div id="look"></div>
  <div class="tbtn" id="b-interact">USAR</div>
  <div class="tbtn" id="b-jump">PULO</div>
  <div class="tbtn" id="b-mount">MONTAR</div>
  <div class="tbtn" id="b-run">CORRER</div>
</div>

<div id="cutscene">
  <video id="cut-video" playsinline webkit-playsinline preload="auto"></video>
  <img id="cut-img" alt="">
  <button id="cut-skip">PULAR ▸</button>
</div>

<div id="loading">
  <div class="spin"></div>
  <p>Preparando o vale...</p>
</div>

<div id="menu">
  <div class="title-wrap">
    <div class="title">ANDORA</div>
    <div class="subtitle">o vale das lanternas</div>
  </div>
  <div class="save-list" id="save-list"></div>
  <div class="menu-card">
    <button class="btn primary" id="btn-play">JOGAR</button>
    <button class="btn" id="btn-new">NOVO MUNDO</button>
    <button class="btn" id="btn-continue" style="display:none">CONTINUAR</button>
    <button class="btn" id="btn-cutscene">REVIVER CENA</button>
    <button class="btn" id="btn-sound-menu">SOM: LIGADO</button>
  </div>
  <div class="menu-foot">
    WASD mover · SHIFT correr · E interagir · Q montar · ESPAÇO pular<br>
    Toque: joystick à esquerda · mundo infinito · clima dinâmico · 6 finais
  </div>
</div>

<script>
/* ============ CENA DE ABERTURA (vídeo real, com fallback em imagens) ============ */
window.Cutscene = (function () {
  var el, vid, img, btn, idx = 0, active = false;
  var VID = ['cut-0.mp4', 'cut-1.mp4', 'cut-2.mp4', 'cut-3.mp4', 'cut-4.mp4'];
  var IMG = ['arte/a1-estrada.png', 'arte/a2-ponte.png', 'arte/a3-vila.png', 'arte/a4-lago.png'];
  var DUR = [14.13, 13.13, 10.6, 13.47, 11.53];
  function init() {
    el = document.getElementById('cutscene');
    vid = document.getElementById('cut-video');
    img = document.getElementById('cut-img');
    btn = document.getElementById('cut-skip');
    btn.onclick = function () { stop(); };
    vid.addEventListener('ended', function () { idx++; playNext(); });
    vid.addEventListener('error', function () { useImg(); });
    img.addEventListener('click', function () { idx++; playNext(); });
  }
  function useImg() {
    var i = Math.min(idx, IMG.length - 1);
    vid.style.display = 'none';
    img.style.display = 'block';
    img.src = IMG[i];
    clearTimeout(window.__cutT);
    window.__cutT = setTimeout(function () { idx++; playNext(); }, 7000);
  }
  function playNext() {
    if (idx >= VID.length) { stop(); return; }
    if (idx >= 3 && !vid.readyState) { useImg(); return; }
    try {
      img.style.display = 'none';
      vid.style.display = 'block';
      vid.src = VID[idx];
      vid.currentTime = 0;
      var p = vid.play();
      if (p && p.catch) p.catch(function () { useImg(); });
    } catch (e) { useImg(); }
  }
  function play() {
    if (!el) init();
    active = true;
    idx = 0;
    el.style.display = 'flex';
    playNext();
  }
  function stop() {
    active = false;
    clearTimeout(window.__cutT);
    try { vid.pause(); } catch (e) { }
    if (el) el.style.display = 'none';
    try { localStorage.setItem('andora-cut-v2', '1'); } catch (e) { }
    if (window.__onCutEnd) window.__onCutEnd();
  }
  function seen() {
    try { return localStorage.getItem('andora-cut-v2') === '1'; } catch (e) { return false; }
  }
  return { play: play, stop: stop, seen: seen, init: init };
})();
</script>
<script>
/* ============ comportamento do menu ============ */
(function () {
  if ('ontouchstart' in window) document.body.classList.add('touch');
  function $(id) { return document.getElementById(id); }
  function refreshSaves() {
    var box = $('save-list');
    box.innerHTML = '';
    try {
      var all = JSON.parse(localStorage.getItem('andora-worlds-v2') || '{}');
      var keys = Object.keys(all);
      keys.forEach(function (k) {
        var w = all[k];
        var d = new Date(w.at || Date.now());
        var div = document.createElement('div');
        div.className = 'save-item';
        div.textContent = 'MUNDO ' + k.toUpperCase() + ' · dia ' + (w.day || 1) + ' · ' +
          (w.ending ? 'final completo' : 'sem final') + ' · ' + d.toLocaleDateString('pt-BR');
        div.onclick = function () { window.__startGame && window.__startGame(k); };
        box.appendChild(div);
      });
      if (!keys.length) {
        var none = document.createElement('div');
        none.className = 'save-item';
        none.style.opacity = '.55';
        none.textContent = 'Nenhum mundo salvo ainda';
        box.appendChild(none);
      }
    } catch (e) { }
  }
  refreshSaves();
  $('btn-play').onclick = function () {
    window.__startGame && window.__startGame('slot1');
  };
  $('btn-new').onclick = function () {
    window.__startGame && window.__startGame(null, true);
  };
  $('btn-cutscene').onclick = function () {
    window.Cutscene.play();
  };
  function soundBtn() {
    var on = !(window.__soundOn === false);
    $('btn-sound-menu').textContent = 'SOM: ' + (on ? 'LIGADO' : 'DESLIGADO');
    var p = $('btn-sound');
    if (p) p.textContent = 'SOM: ' + (on ? 'LIGADO' : 'DESLIGADO');
  }
  $('btn-sound-menu').onclick = function () {
    window.__soundOn = window.__soundOn === false;
    soundBtn();
    if (window.__AO && window.__AO.setSound) window.__AO.setSound(window.__soundOn);
  };
  $('btn-save').onclick = function () {
    if (window.__AO && window.__AO.saveNow) window.__AO.saveNow();
  };
  $('btn-sound') && ($('btn-sound').onclick = function () {
    window.__soundOn = window.__soundOn === false;
    soundBtn();
    if (window.__AO && window.__AO.setSound) window.__AO.setSound(window.__soundOn);
  });
  window.__onCutEnd = function () {
    if (window.__pendingStart) {
      var fn = window.__pendingStart;
      window.__pendingStart = null;
      fn();
    }
  };
  window.__startGame = function (slot, isNew) {
    $('loading').style.display = 'flex';
    var begin = function () {
      if (window.__AO) {
        if (isNew) window.__AO.newWorld();
        else if (slot && window.__AO.load(slot)) { /* ok */ }
        window.__AO.resume();
      }
      $('menu').classList.add('hidden');
      $('loading').style.display = 'none';
      if (!window.Cutscene.seen()) {
        window.__pendingStart = null;
        window.Cutscene.play();
      }
    };
    // espera o mundo 3D estar pronto (assets carregando)
    var tries = 0;
    var wait = function () {
      if (window.__AO && window.__AO.ready && window.__AO.ready()) begin();
      else if (++tries > 120) begin();
      else setTimeout(wait, 150);
    };
    wait();
  };
})();
</script>
<!-- {{GAME_JS}} -->
</body>
</html>
